name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example 0.2.1"
        required: true
        default: "0.2.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev

      - name: Build packages
        run: bash scripts/build-packages.sh "${{ steps.version.outputs.version }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: idle-shutdown-guard-packages-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Attach packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: idle-shutdown-guard ${{ steps.version.outputs.tag }}
          body_path: RELEASE.md
          files: dist/*
