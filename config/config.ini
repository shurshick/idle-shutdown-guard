[settings]
# Show a tray icon with status, settings, manual check, and quit actions.
# If GTK is unavailable, the program automatically falls back to background mode.
tray_enabled = yes

# Hour of day when the guard starts checking idle time: 0..23.
# Example: 22 means warnings can start from 22:00 until midnight.
begin_hour = 22

# Show a shutdown warning after this many idle minutes.
idle_minutes = 60

# If the warning is not postponed during this time, shutdown starts.
warning_timeout_minutes = 5

# Postpone duration after the user presses the postpone button.
defer_minutes = 60

# How often the background service checks the idle state.
check_interval_seconds = 60

# Use --ignore-inhibitors to close applications and proceed even when apps try
# to block shutdown. Avoid double --force unless you intentionally want an
# immediate low-level poweroff.
shutdown_command = systemctl poweroff --ignore-inhibitors
